name: Bug report
description: Something doesn't work or gives a wrong answer
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom right of the window, e.g. "Spicey Electrons v0.4.0-wip · Built 2026-11-18 14:12"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Computer and browser
      placeholder: e.g. Linux Mint 22, Firefox 132 / Windows 11, Edge / Bazzite on ROG Ally
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: circuit
    attributes:
      label: Your circuit
      description: Save it with 💾 and attach the file, or paste the netlist from "For the curious" under the result.
  - type: textarea
    id: log
    attributes:
      label: Messages
      description: Anything printed in the black launcher window, or the engine messages under "For the curious".
      render: text
