[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spicey-electrons"
version = "0.4.0.dev0"  # 0.4.0-wip (pip needs PEP 440 spelling)
description = "A beginner-friendly circuit simulator with a real SPICE (ngspice) engine underneath"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Matthew Armstrong", email = "335691363+The-Dorkknight@users.noreply.github.com" }]
keywords = ["ngspice", "spice", "circuit-simulator", "electronics-education"]
classifiers = ["License :: Other/Proprietary License", "Programming Language :: Python :: 3", "Topic :: Education", "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"]

[project.urls]
Homepage = "https://github.com/The-Dorkknight/spicey-electrons"

[project.scripts]
spicey-electrons = "spiceyelectrons.server:serve"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["spiceyelectrons"]

[tool.setuptools.package-data]
spiceyelectrons = ["web/*"]
